# ==============================================================
# CodeSentinel AI — Infrastructure Services
# ==============================================================
# Starts ONLY the data stores and messaging layer.
# Run with: docker compose -f docker-compose.infra.yml up -d
# ==============================================================

services:

  # ---- PostgreSQL: Relational database for Auth, Ingestion, Parser ----
  postgres:
    image: postgres:16-alpine
    container_name: codesentinel-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
    volumes:
      # Persist data across container restarts
      - postgres_data:/var/lib/postgresql/data
      # Run init-db.sql on first startup to create all databases
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis: Caching, rate limiting, session store ----
  redis:
    image: redis:7-alpine
    container_name: codesentinel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Neo4j: Graph database for dependency analysis ----
  neo4j:
    image: neo4j:5-community
    container_name: codesentinel-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data

  # ---- Zookeeper: Required by Kafka for cluster coordination ----
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: codesentinel-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ---- Kafka: Async event messaging between microservices ----
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: codesentinel-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

# ---- Named volumes: Docker manages these on disk ----
volumes:
  postgres_data:
  redis_data:
  neo4j_data: