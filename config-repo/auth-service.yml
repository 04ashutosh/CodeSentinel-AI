server:
  port: ${AUTH_SERVICE_PORT:8081}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_AUTH_DB:auth_db}
    username: ${POSTGRES_USER:codesentinel}
    password: ${POSTGRES_PASSWORD:codesentinel_secret_2024}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Use update for now until Flyway is added
      ddl-auto: update
    show-sql: true