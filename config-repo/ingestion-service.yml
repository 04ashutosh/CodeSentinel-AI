server:
  port: ${INGESTION_SERVICE_PORT:8082}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_INGESTION_DB:ingestion_db}
    username: ${POSTGRES_USER:codesentinel}
    password: ${POSTGRES_PASSWORD:codesentinel_secret_2024}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Where uploaded projects are stored on disk
ingestion:
  storage-path: ${INGESTION_STORAGE_PATH:./uploads}