server:
  port: ${GATEWAY_PORT:8080}

spring:
  cloud:
    gateway:
      discovery:
        locator:
          # Automatically create routes for services registered in Eureka
          enabled: true
          lower-case-service-id: true

      # Explicit routing rules
      routes:
        - id: auth-service
          uri: lb://auth-service   # 'lb://' means Load Balancer (look up in Eureka)
          predicates:
            - Path=/api/v1/auth/**
        - id: ingestion-service
          uri: lb://ingestion-service
          predicates:
            - Path=/api/v1/ingestion/**
        - id: parser-service
          uri: lb://parser-service
          predicates:
            - Path=/api/v1/parser/**
        - id: graph-intelligence-service
          uri: lb://graph-intelligence-service
          predicates:
            - Path=/api/v1/graph/**
        - id: ai-analysis-service
          uri: lb://ai-analysis-service
          predicates:
            - Path=/api/v1/ai/**
